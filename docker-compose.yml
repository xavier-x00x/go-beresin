version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: go_beresin_app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://root:passwordroot@host.docker.internal:5432/go_beresin?sslmode=disable
      - REDIS_ADDR=host.docker.internal:6379
      - REDIS_PASSWORD=!Abcd1234
      - JWT_SECRET=super_secret_jwt_key_12345
    extra_hosts:
      - "host.docker.internal:host-gateway" # Enables container to access preinstalled Postgres & Redis on the host's Docker/system network
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Web Console
    volumes:
      - minio_data:/data
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Low memory footprint for local dev
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: always

volumes:
  minio_data:
  es_data:
