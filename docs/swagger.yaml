basePath: /
definitions:
  handler.ForgotPasswordReq:
    properties:
      email:
        type: string
    type: object
  handler.GoogleLoginReq:
    properties:
      token:
        type: string
    type: object
  handler.LoginReq:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      role:
        example: admin
        type: string
      username:
        example: johndoe
        type: string
    type: object
  handler.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    type: object
  handler.RegisterReq:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        description: '''user'', ''talent'''
        type: string
    type: object
  handler.ResetPasswordReq:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  handler.Response:
    properties:
      data: {}
      message:
        example: Operation completed successfully
        type: string
      status:
        example: success
        type: string
    type: object
  handler.SendOtpReq:
    properties:
      phone:
        type: string
    type: object
  handler.VerifyOtpReq:
    properties:
      otp:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@go-beresin.com
    name: API Support
  description: High-performance backend API skeleton for Go Beresin featuring Fiber,
    Redis-based Rate Limiting, JWT auth with RBAC, and Multipart file uploading.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Beresin API
  version: 1.0.0
paths:
  /api/v1/admin:
    get:
      description: 'Access administrator dashboard (restricted to role: admin)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Admin Endpoint
      tags:
      - Admin
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset email token
      parameters:
      - description: Forgot Password Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Forgot Password
      tags:
      - Authentication
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Login Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handler.Response'
      summary: User Login
      tags:
      - Authentication
  /api/v1/auth/login-mock:
    post:
      consumes:
      - application/json
      description: 'Authenticate a dummy user and return a JWT token (roles: user,
        admin)'
      parameters:
      - description: Login Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Mock Login
      tags:
      - Authentication
  /api/v1/auth/login/google:
    post:
      consumes:
      - application/json
      description: Login or register automatically via Google OAuth token
      parameters:
      - description: Google Token Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GoogleLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Google Social Login
      tags:
      - Authentication
  /api/v1/auth/login/whatsapp/send-otp:
    post:
      consumes:
      - application/json
      description: Request a 6-digit WhatsApp login OTP
      parameters:
      - description: Send OTP Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SendOtpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Send WhatsApp OTP
      tags:
      - Authentication
  /api/v1/auth/login/whatsapp/verify:
    post:
      consumes:
      - application/json
      description: Verify WhatsApp OTP code and start login session
      parameters:
      - description: Verify OTP Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyOtpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Verify WhatsApp OTP
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      description: Invalidate user active session and revoke refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - Authentication
  /api/v1/auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Rotate expired access token using valid refresh token
      parameters:
      - description: Refresh Token Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Refresh Token Rotation
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new client or talent account
      parameters:
      - description: Register Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.Response'
      summary: User Registration
      tags:
      - Authentication
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password utilizing valid email reset token
      parameters:
      - description: Reset Password Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Reset Password
      tags:
      - Authentication
  /api/v1/profile:
    get:
      description: Fetch authenticated user identity from Bearer token claims
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Profile
      tags:
      - Users
  /api/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload any photo, video, or document (max 10MB limit)
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: File Upload
      tags:
      - Uploads
  /health:
    get:
      description: Check if the server is up and healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Health Check
      tags:
      - System
securityDefinitions:
  BearerAuth:
    description: Type "Bearer <your_token>" to authenticate.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
